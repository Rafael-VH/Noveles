<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovelEs — Dashboard de Diagramas</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel2: #1d2130;
    --border: #2a2f3f;
    --text: #e6e8ee;
    --muted: #9aa3b5;
    --accent: #26a69a;
    --accent2: #4db6ac;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  [data-theme="light"] {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --panel2: #eef1f7;
    --border: #dde2ec;
    --text: #1a1f2b;
    --muted: #5a6274;
    --shadow: 0 10px 30px rgba(20,30,60,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; transition: background .25s, color .25s;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 22px 32px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #themeBtn {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #themeBtn:hover { border-color: var(--accent); }
  main { max-width: 1080px; margin: 0 auto; padding: 32px; }
  #count { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; cursor: pointer;
    text-decoration: none; color: var(--text); display: block;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
  .card .icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin-bottom: 14px;
  }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .card p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .card .tag {
    display: inline-block; margin-top: 12px; font-size: 11px;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    padding: 3px 10px; border-radius: 999px;
  }
  #empty { color: var(--muted); text-align: center; padding: 60px 0; display: none; }
  footer { color: var(--muted); text-align: center; font-size: 12px; padding: 28px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>NovelEs <span>📐</span> Diagramas</h1>
    <p>Dashboard de diagramas interactivos</p>
  </div>
  <button id="themeBtn" onclick="toggleTheme()" title="Cambiar tema">🌓 Tema</button>
</header>

<main>
  <p id="count">Cargando…</p>
  <div id="grid"></div>
  <div id="empty">No hay diagramas todavía.<br>Agregalos al <code>manifest.json</code>.</div>
</main>

<footer>Agregá un diagrama editando <code>docs/diagrams/config/manifest.json</code></footer>

<script>
  // Tema: recuerda preferencia; respeta el inicial del documento.
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('archman-theme', t); } catch (e) {}
  }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }
  let initial = 'dark';
  try { initial = localStorage.getItem('archman-theme') || 'dark'; } catch (e) {}
  applyTheme(initial);

  // Carga el manifest y arma las cards. Nuevo diagrama = una entrada en el JSON.
  fetch('manifest.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      const grid = document.getElementById('grid');
      const count = document.getElementById('count');
      const groups = (data && Array.isArray(data.groups)) ? data.groups : [];
      const total = groups.reduce((n, g) => n + ((g.diagrams || []).length), 0);
      count.textContent = total ? total + ' diagrama(s) disponible(s)' : '';
      grid.innerHTML = '';
      // Renderizá por grupo = una seccion por carpeta en docs/diagrams/<dominio>/.
      groups.forEach(g => {
        const sec = document.createElement('section');
        sec.className = 'group';
        sec.innerHTML = '<h2 class="groupTitle">' + (g.icon || '') + ' ' + g.name + '</h2>';
        const cards = document.createElement('div');
        cards.className = 'cards';
        const list = (g.diagrams && g.diagrams.length) ? g.diagrams : [];
        if (!list.length) {
          const ph = document.createElement('p');
          ph.className = 'groupEmpty';
          ph.textContent = g.placeholder || ('Sin diagramas todavía. Agregá el HTML en docs/diagrams/' + g.id + '/ y una entrada en manifest.json.');
          cards.appendChild(ph);
        }
        list.forEach(d => {
          const a = document.createElement('a');
          a.className = 'card';
          a.href = d.file;
          a.title = d.name;
          a.innerHTML =
            '<div class="icon">' + (d.icon || '📊') + '</div>' +
            '<h3>' + d.name + '</h3>' +
            '<p>' + (d.description || '') + '</p>' +
            (d.tag ? '<span class="tag">' + d.tag + '</span>' : '');
          cards.appendChild(a);
        });
        sec.appendChild(cards);
        grid.appendChild(sec);
      });
      document.getElementById('empty').style.display = total ? 'none' : 'block';
    })
    .catch(err => {
      document.getElementById('count').textContent = '⚠️ No se pudo cargar manifest.json — ' + err.message;
      document.getElementById('empty').style.display = 'block';
    });
</script>
</body>
</html>
