<svg viewBox="0 0 1280 800" role="img" lang="es" aria-labelledby="sb-title sb-desc" data-preset="classic">
  <title id="sb-title">NovelEs - Backend Supabase</title>
  <desc id="sb-desc">Supabase: Postgres + Auth + Storage + Edge Functions con RLS. Generado desde supabase/migrations.</desc>
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .title{font:700 22px/1.2 system-ui;fill:#e2e8f0}
  .sub{font:500 12px/1.4 system-ui;fill:#94a3b8}
  .grp-h{font:700 13px/1.2 system-ui;letter-spacing:.05em;text-transform:uppercase}
  .svc-h{font:700 12px/1.2 system-ui;fill:#e2e8f0}
  .bt{font:600 12px/1.2 system-ui;fill:#0f172a}
  .bs{font:500 10.5px/1.3 system-ui;fill:#475569}
  .grp{fill:rgba(30,41,59,.55);stroke:#334155;stroke-width:1.2;rx:12}
  .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1;rx:6}
  .box-a{fill:#dbeafe;stroke:#93c5fd;stroke-width:1;rx:6}
  .box-s{fill:#fef3c7;stroke:#fcd34d;stroke-width:1;rx:6}
  .box-e{fill:#ede9fe;stroke:#c4b5fd;stroke-width:1;rx:6}
  .box-sec{fill:#fff7ed;stroke:#fdba74;stroke-width:1.2;rx:6}
</style>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="36" y="44" class="title">Backend Supabase &#183; NovelEs</text>
  <text x="36" y="64" class="sub">Postgres + RLS &#183; Auth JWT &#183; Storage &#183; Edge Functions   (fuente: supabase/migrations)</text>

  <rect x="28" y="420" width="344" height="340" class="grp"/>
  <text x="48" y="444" class="grp-h" fill="#e2e8f0">Base de datos &#183; Postgres + RLS</text>
  <rect x="48" y="458" width="304" height="26" class="box"/><text x="62" y="475" class="bt">profiles</text><text x="100" y="475" class="bs">rol: user/scan/admin &#183; suspensi&#243;n</text>
  <rect x="48" y="492" width="304" height="26" class="box"/><text x="62" y="509" class="bt">books</text><text x="96" y="509" class="bs">estado, visibilidad escaneada</text>
  <rect x="48" y="526" width="304" height="26" class="box"/><text x="62" y="543" class="bt">chapters</text><text x="96" y="543" class="bs">contenido &#183; tipo </text>
  <rect x="48" y="560" width="304" height="26" class="box"/><text x="62" y="577" class="bt">tooks</text><text x="96" y="577" class="bs">sumario/lectura por cap&#237;tulo</text>
  <rect x="48" y="594" width="304" height="26" class="box"/><text x="62" y="611" class="bt">book_views &#183; chapter_reads</text><text x="190" y="611" class="bs">anal&#237;tica de lectura</text>
  <rect x="48" y="628" width="304" height="26" class="box"/><text x="62" y="645" class="bt">labels &#183; label_rules</text><text x="160" y="645" class="bs">auto-etiquetado</text>
  <rect x="48" y="662" width="304" height="26" class="box-a"/><text x="62" y="679" class="bt">RLS everywhere</text><text x="130" y="679" class="bs">filas por rol via JWT + security definer</text>
  <rect x="48" y="696" width="304" height="26" class="box-sec"/><text x="62" y="713" class="bt">funciones</text><text x="112" y="713" class="bs">top/mas vistos/trends/admin. &#183; RPC via PostgREST</text>

  <rect x="400" y="420" width="344" height="340" class="grp"/>
  <text x="420" y="444" class="grp-h" fill="#e2e8f0">Auth &#183; Supabase Auth</text>
  <rect x="420" y="458" width="304" height="26" class="box-a"/><text x="434" y="475" class="bt">email/password</text><text x="500" y="475" class="bs">session JWT</text>
  <rect x="420" y="492" width="304" height="26" class="box"/><text x="434" y="509" class="bt">auth.users &#8594; profiles</text><text x="548" y="509" class="bs">trigger handle_new_user</text>
  <rect x="420" y="526" width="304" height="26" class="box-a"/><text x="434" y="543" class="bt">roles</text><text x="472" y="543" class="bs">is_admin &#183; is_scan &#183; is_user &#183; is_suspended</text>
  <rect x="420" y="560" width="304" height="26" class="box-sec"/><text x="434" y="577" class="bt">seguridad</text><text x="486" y="577" class="bs">proteccion anti-escalada de rol (RLS)</text>

  <rect x="772" y="420" width="344" height="340" class="grp"/>
  <text x="792" y="444" class="grp-h" fill="#e2e8f0">Edge Functions &#183; Deno</text>
  <rect x="792" y="458" width="304" height="52" class="box-a"/>
  <text x="806" y="475" class="bt">sync-labels</text>
  <text x="806" y="490" class="bs">lee label_rules y ajusta labels por</text>
  <text x="806" y="503" class="bs">new_release &#183; most_read &#183; most_favorited</text>
  <rect x="792" y="520" width="304" height="26" class="box"/><text x="806" y="537" class="bt">invoke con service_role</text><text x="950" y="537" class="bs">CRON / manual</text>
  <text x="792" y="590" class="sub">Storage</text>
  <rect x="792" y="598" width="304" height="52" class="box"/>
  <text x="806" y="615" class="bt">buckets: covers &#183; avatars</text>
  <text x="806" y="630" class="bs">path &#8594; tipo de contenido; lecturas via</text>
  <text x="806" y="643" class="bs">Signed URL / RLS storage</text>
  <rect x="792" y="658" width="304" height="26" class="box-s"/><text x="806" y="675" class="bt">Realtime</text><text x="858" y="675" class="bs">(sin publicaci&#243;n abierta &#8212; no dibujado)</text>

  <path class="ln" d="M 0 0"/>
</svg>