name: noveles
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.0

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI / COMPONENTES VISUALES
  carousel_slider: ^5.1.2

  # ARQUITECTURA / STATE MANAGEMENT
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ALMACENAMIENTO / PERSISTENCIA
  shared_preferences: ^2.2.2


  # Dependency Injection
  get_it: ^7.6.0

  # SUPABASE
  supabase_flutter: ^2.10.0

  # PICKERS
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  path_provider: ^2.1.4

  # IMAGE CACHING
  cached_network_image: ^3.4.1

  # OTROS
  flutter_native_splash: ^2.4.1
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - .env


