name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/diagramas/**'
      - 'docs/index.html'
      - 'tools/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/diagramas/**'
      - 'docs/index.html'
      - 'tools/**'
      - '.github/workflows/docs.yml'

jobs:
  dashboard:
    name: Dashboard al día
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar el dashboard
        run: node tools/build-diagrams.mjs

      - name: Verificar que no queden cambios sin commitear
        run: |
          if ! git diff --quiet -- docs/index.html docs/404.html docs/diagramas; then
            echo "::error::docs/index.html, docs/404.html o docs/diagramas/manifest.json están desactualizados."
            echo "Corré 'node tools/build-diagrams.mjs' en local y commiteá el resultado."
            git diff --stat -- docs/index.html docs/404.html docs/diagramas
            exit 1
          fi
          echo "El dashboard está al día."
